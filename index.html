<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CFA Master Flashcards</title>
    <!-- Use an emoji as a favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    
    <!-- External Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root { --bg-color: #f0f2f5; --text-color: #1c1e21; --card-bg: #ffffff; --card-back-bg: linear-gradient(135deg, #002060, #004080); --card-border: #e4e6eb; --btn-primary: #0084ff; }
        body.dark-mode { --bg-color: #18191a; --text-color: #e4e6eb; --card-bg: #242526; --card-back-bg: linear-gradient(135deg, #0a1930, #112240); --card-border: #3a3b3c; --btn-primary: #2d88ff; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 15px; margin: 0; transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }
        
        .top-bar { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .action-btn { padding: 8px 12px; font-size: 14px; background: #6c757d; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .action-btn:active { transform: scale(0.95); }
        
        .header { text-align: center; width: 100%; max-width: 450px; }
        h2 { margin: 5px 0 15px 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        
        select { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; border: 1px solid var(--card-border); background-color: var(--card-bg); color: var(--text-color); margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); font-weight: 600; appearance: none; outline: none; }
        
        .progress-container { width: 100%; background-color: #ddd; border-radius: 10px; height: 10px; margin-bottom: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background-color: #28a745; width: 0%; transition: width 0.4s ease; }
        .progress-text { font-size: 13px; margin-bottom: 15px; font-weight: 600; color: #888; }

        .card-container { perspective: 1500px; width: 100%; max-width: 450px; height: 320px; margin-bottom: 25px; cursor: pointer; display: none; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .card.is-flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box; border-radius: 20px; text-align: center; font-size: 20px; line-height: 1.5; font-weight: 600; overflow-y: auto; }
        .card-front { background: var(--card-bg); border: 2px solid var(--card-border); }
        .card-back { transform: rotateY(180deg); background: var(--card-back-bg); color: white; border: none; font-size: 18px; font-weight: 500; }
        
        .controls { display: none; width: 100%; max-width: 450px; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .nav-btn { padding: 15px 25px; font-size: 18px; border: none; border-radius: 30px; background-color: var(--btn-primary); color: white; cursor: pointer; transition: background 0.2s, transform 0.1s; font-weight: bold; width: 45%; box-shadow: 0 4px 10px rgba(0,132,255,0.3); }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn:disabled { background-color: #a0c3e8; cursor: not-allowed; box-shadow: none; }
        
        .utilities { display: none; width: 100%; max-width: 450px; justify-content: space-around; align-items: center; margin-bottom: 30px; }
        
        .hint-text { margin-top: 15px; font-style: italic; color: #e67e22; display: none; font-size: 15px; padding: 12px; border-radius: 10px; background: rgba(230, 126, 34, 0.1); width: 100%; max-width: 450px; text-align: center; font-weight: 600; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="action-btn" onclick="toggleDarkMode()" id="dark-mode-btn">🌙 Dark</button>
        <button class="action-btn" onclick="shuffleDeck()" id="shuffle-btn" style="display:none; background:#8e44ad;">🔀 Shuffle</button>
        <button class="action-btn" onclick="resetProgress()" id="reset-btn" style="display:none; background:#e74c3c;">🔄 Reset</button>
    </div>

    <div class="header">
        <h2>CFA Master Flashcards</h2>
        <select id="subject-select" onchange="loadSelectedDeck()">
            <option value="">-- Choose a Subject to Study --</option>
            <option value="CFA_Ethics_Part1_Flashcards.xlsx">Ethics (Part 1)</option>
            <option value="CFA_Ethics_Part2_Flashcards.xlsx">Ethics (Part 2)</option>
            <option value="CFA_Quant_Part1_Flashcards.xlsx">Quantitative Methods (Part 1)</option>
            <option value="CFA_Quant_Part2_Flashcards.xlsx">Quantitative Methods (Part 2)</option>
            <option value="CFA_Economics_Part1_Flashcards.xlsx">Economics (Part 1)</option>
            <option value="CFA_Economics_Part2_Flashcards.xlsx">Economics (Part 2)</option>
            <option value="CFA_FSA_Part1_Flashcards.xlsx">FSA (Part 1)</option>
            <option value="CFA_FSA_Part2_Flashcards.xlsx">FSA (Part 2)</option>
            <option value="CFA_Corporate_Part1_Flashcards.xlsx">Corporate Issuers (Part 1)</option>
            <option value="CFA_Corporate_Part2_Flashcards.xlsx">Corporate Issuers (Part 2)</option>
            <option value="CFA_Equities_Part1_Flashcards.xlsx">Equities (Part 1)</option>
            <option value="CFA_Equities_Part2_Flashcards.xlsx">Equities (Part 2)</option>
            <option value="CFA_FixedIncome_Part1_Flashcards.xlsx">Fixed Income (Part 1)</option>
            <option value="CFA_FixedIncome_Part2_Flashcards.xlsx">Fixed Income (Part 2)</option>
            <option value="CFA_Derivatives_Part1_Flashcards.xlsx">Derivatives (Part 1)</option>
            <option value="CFA_Derivatives_Part2_Flashcards.xlsx">Derivatives (Part 2)</option>
            <option value="CFA_Alts_Part1_Flashcards.xlsx">Alternative Investments (Part 1)</option>
            <option value="CFA_Alts_Part2_Flashcards.xlsx">Alternative Investments (Part 2)</option>
            <option value="CFA_Portfolio_Part1_Flashcards.xlsx">Portfolio Construction (Part 1)</option>
            <option value="CFA_Portfolio_Part2_Flashcards.xlsx">Portfolio Construction (Part 2)</option>
        </select>
        
        <div class="progress-container" id="progress-container" style="display:none;">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="progress-text" id="progress"></div>
    </div>

    <!-- Wrapping card in a container to capture cleanly for Image Save -->
    <div id="capture-area" style="width: 100%; max-width: 450px; display: flex; justify-content: center;">
        <div class="card-container" id="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-face card-front" id="card-front">Front</div>
                <div class="card-face card-back" id="card-back">Back</div>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="nav-btn" onclick="prevCard()" id="btn-prev">⬅️ Prev</button>
        <button class="nav-btn" onclick="nextCard()" id="btn-next">Next ➡️</button>
    </div>

    <div class="utilities" id="utilities">
        <button class="action-btn" onclick="toggleHint()" id="btn-hint" style="background-color: #f39c12;">💡 Hint</button>
        <button class="action-btn" onclick="saveAsImage()" style="background-color: #27ae60;">📸 Save Image</button>
    </div>
    
    <div class="hint-text" id="hint-text"></div>

    <script>
        let currentDeck = [];
        let currentIndex = 0;
        let currentFilename = "";

        // Initialization & Dark Mode
        if(localStorage.getItem('cfaDarkMode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('dark-mode-btn').innerText = '☀️ Light';
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('cfaDarkMode', isDark);
            document.getElementById('dark-mode-btn').innerText = isDark ? '☀️ Light' : '🌙 Dark';
        }

        async function loadSelectedDeck() {
            currentFilename = document.getElementById('subject-select').value;
            if (!currentFilename) return;

            // Hide UI while loading
            document.getElementById('card-container').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('utilities').style.display = 'none';
            document.getElementById('hint-text').style.display = 'none';
            document.getElementById('shuffle-btn').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'none';
            document.getElementById('progress-container').style.display = 'none';
            document.getElementById('progress').innerText = 'Downloading deck from GitHub...';

            try {
                const response = await fetch(currentFilename);
                if (!response.ok) throw new Error("File not found");
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                currentDeck = data.slice(1).filter(row => row.length >= 3).map(row => ({
                    front: row[1] || "",
                    back: row[2] || "",
                    hint: row[3] || ""
                }));

                if (currentDeck.length > 0) {
                    // Check LocalStorage for saved progress
                    let savedIndex = localStorage.getItem(`cfa_progress_${currentFilename}`);
                    currentIndex = savedIndex ? parseInt(savedIndex) : 0;
                    
                    // Show UI
                    document.getElementById('card-container').style.display = 'block';
                    document.getElementById('controls').style.display = 'flex';
                    document.getElementById('utilities').style.display = 'flex';
                    document.getElementById('shuffle-btn').style.display = 'block';
                    document.getElementById('reset-btn').style.display = 'block';
                    document.getElementById('progress-container').style.display = 'block';
                    updateCard();
                }
            } catch (error) {
                document.getElementById('progress').innerText = 'Error: Excel file not found. Ensure it is uploaded to GitHub.';
            }
        }

        function updateCard() {
            document.getElementById('card').classList.remove('is-flipped');
            document.getElementById('card-front').innerText = currentDeck[currentIndex].front;
            document.getElementById('card-back').innerText = currentDeck[currentIndex].back;
            
            const hintText = currentDeck[currentIndex].hint;
            document.getElementById('hint-text').innerText = hintText;
            document.getElementById('hint-text').style.display = 'none';
            document.getElementById('btn-hint').style.display = hintText ? 'block' : 'none';
            
            // Save Progress
            localStorage.setItem(`cfa_progress_${currentFilename}`, currentIndex);
            
            // Update Progress Bar
            const percent = ((currentIndex + 1) / currentDeck.length) * 100;
            document.getElementById('progress-bar-fill').style.width = percent + '%';
            document.getElementById('progress').innerText = `Card ${currentIndex + 1} of ${currentDeck.length}`;
            
            // Manage Buttons
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            
            if (currentIndex === currentDeck.length - 1) {
                document.getElementById('btn-next').disabled = true;
                triggerConfetti();
            } else {
                document.getElementById('btn-next').disabled = false;
            }
        }

        function flipCard() { document.getElementById('card').classList.toggle('is-flipped'); }
        function toggleHint() { 
            const hint = document.getElementById('hint-text');
            hint.style.display = hint.style.display === 'none' ? 'block' : 'none';
        }
        function nextCard() { if (currentIndex < currentDeck.length - 1) { currentIndex++; updateCard(); } }
        function prevCard() { if (currentIndex > 0) { currentIndex--; updateCard(); } }
        
        function resetProgress() {
            if(confirm("Start this deck from the beginning?")) {
                currentIndex = 0;
                updateCard();
            }
        }

        function shuffleDeck() {
            for (let i = currentDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
            }
            currentIndex = 0;
            updateCard();
            alert("Deck Shuffled! (Progress tracking disabled for this session)");
        }

        // Celebrate finishing a deck!
        function triggerConfetti() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#28a745', '#007bff', '#ffc107', '#dc3545']
            });
        }

        // Save Card as Image
        function saveAsImage() {
            const cardEl = document.getElementById('card');
            const originalTransform = cardEl.style.transform;
            
            // Temporarily disable 3D transform for a clean 2D snapshot
            if (cardEl.classList.contains('is-flipped')) {
                cardEl.style.transform = "rotateY(0deg)"; // temporarily unflip the parent container
                document.getElementById('card-back').style.transform = "rotateY(0deg)"; // face back forward
                document.getElementById('card-front').style.display = "none";
            }
            
            html2canvas(cardEl, { backgroundColor: null, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `CFA_Flashcard_${currentIndex+1}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                
                // Restore original CSS state
                cardEl.style.transform = originalTransform;
                document.getElementById('card-back').style.transform = "rotateY(180deg)";
                document.getElementById('card-front').style.display = "flex";
            });
        }

        // Keyboard & Swipe Support
        document.addEventListener('keydown', (e) => {
            if(currentDeck.length === 0) return;
            if (e.key === 'ArrowRight') nextCard();
            else if (e.key === 'ArrowLeft') prevCard();
            else if (e.key === ' ') { e.preventDefault(); flipCard(); }
        });

        let touchstartX = 0, touchendX = 0;
        const slider = document.getElementById('capture-area');
        slider.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; });
        slider.addEventListener('touchend', e => { 
            touchendX = e.changedTouches[0].screenX; 
            if (touchendX < touchstartX - 40) nextCard(); 
            if (touchendX > touchstartX + 40) prevCard(); 
        });
    </script>
</body>
</html>
