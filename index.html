<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CFA Master Flashcards & Study Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">

    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root { 
            --bg-gradient: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            --text-color: #1e293b; 
            --muted-text: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 8px 32px rgba(30, 41, 59, 0.08);
            --card-bg: #ffffff; 
            --card-back-bg: linear-gradient(135deg, #1e3a8a, #0f172a); 
            --btn-primary: #2563eb; 
            --accent: #0ea5e9;
            --chip-bg: rgba(37, 99, 235, 0.1);
        }
        
        body.dark-mode { 
            --bg-gradient: linear-gradient(135deg, #0f172a, #020617);
            --text-color: #f8fafc; 
            --muted-text: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            --card-bg: #1e293b; 
            --card-back-bg: linear-gradient(135deg, #1e3a8a, #020617); 
            --btn-primary: #3b82f6; 
            --accent: #38bdf8;
            --chip-bg: rgba(59, 130, 246, 0.18);
        }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-gradient); color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 16px 14px 40px 14px; margin: 0; min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; overflow-x: hidden; }
        
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px; width: 100%; max-width: 480px; box-shadow: var(--glass-shadow); margin-bottom: 20px; box-sizing: border-box; }

        .dashboard-stats { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 16px; background: rgba(100, 116, 139, 0.07); border-radius: 16px; padding: 12px; }
        .stat-box { text-align: center; width: 48%; cursor: pointer; border-radius: 10px; padding: 4px; transition: background 0.2s; }
        .stat-box:hover { background: rgba(100, 116, 139, 0.1); }
        .stat-title { font-size: 11px; font-weight: 700; color: var(--muted-text); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-val { font-size: 19px; font-weight: 800; color: var(--btn-primary); }
        .stat-sub { font-size: 10px; color: var(--muted-text); margin-top: 2px; }

        .top-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .action-btn { padding: 9px 14px; font-size: 13px; background: rgba(100, 116, 139, 0.14); color: var(--text-color); border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer; font-weight: 700; transition: all 0.2s; }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.active-toggle { background: var(--btn-primary); color: white; border-color: var(--btn-primary); }
        
        h2 { margin: 0 0 14px 0; font-size: 23px; font-weight: 800; text-align: center; letter-spacing: -0.5px; }
        
        select, .search-input { width: 100%; padding: 14px 16px; font-size: 14px; border-radius: 14px; border: 1px solid var(--glass-border); background-color: var(--card-bg); color: var(--text-color); margin-bottom: 14px; font-weight: 600; outline: none; box-sizing: border-box; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        
        .progress-container { width: 100%; background-color: rgba(100, 116, 139, 0.15); border-radius: 20px; height: 9px; margin-bottom: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--btn-primary)); width: 0%; transition: width 0.4s ease; border-radius: 20px; }
        .progress-text { font-size: 13px; font-weight: 700; text-align: center; color: var(--muted-text); }

        .card-container { perspective: 1500px; width: 100%; max-width: 480px; height: 380px; margin-bottom: 18px; cursor: pointer; display: none; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
        .card.is-flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px; box-sizing: border-box; border-radius: 24px; text-align: center; font-size: 17px; line-height: 1.55; font-weight: 600; overflow-y: auto; }
        .card-front { background: var(--card-bg); border: 1px solid var(--glass-border); }
        .card-back { transform: rotateY(180deg); background: var(--card-back-bg); color: white; border: 1px solid rgba(255,255,255,0.1); }
        
        .controls { display: none; width: 100%; max-width: 480px; justify-content: space-between; margin-bottom: 14px; }
        .nav-btn { padding: 15px 22px; font-size: 15px; border: none; border-radius: 14px; background: var(--btn-primary); color: white; cursor: pointer; font-weight: 800; width: 48%; box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25); transition: all 0.2s; }
        .nav-btn:active { transform: scale(0.96); }
        .nav-btn:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        
        .utilities { display: none; width: 100%; max-width: 480px; justify-content: center; gap: 10px; margin-bottom: 18px; }
        .hint-text { margin-bottom: 18px; font-style: italic; color: #d97706; display: none; font-size: 14px; padding: 14px; border-radius: 12px; background: rgba(217, 119, 6, 0.12); width: 100%; max-width: 480px; box-sizing: border-box; text-align: center; font-weight: 600; border: 1px solid rgba(217, 119, 6, 0.25); }

        .hub-tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 16px; }
        .hub-tab { padding: 10px 4px; font-size: 11px; font-weight: 700; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--card-bg); color: var(--muted-text); cursor: pointer; text-align: center; transition: all 0.2s; word-wrap: break-word; }
        .hub-tab.active { background: var(--btn-primary); color: #ffffff; border-color: var(--btn-primary); box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25); }

        .hub-card { padding: 16px; background: var(--card-bg); border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--glass-border); text-align: left; box-shadow: 0 3px 8px rgba(0,0,0,0.03); }
        .hub-badge { display: inline-block; background: var(--chip-bg); color: var(--btn-primary); padding: 3px 9px; border-radius: 8px; font-size: 11px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
        .hub-title { font-size: 15px; font-weight: 800; margin: 0 0 6px 0; color: var(--text-color); }
        .hub-formula { font-family: 'Courier New', monospace; background: rgba(100, 116, 139, 0.1); padding: 8px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; margin: 8px 0; color: var(--btn-primary); overflow-x: auto; }
        .hub-desc { font-size: 13px; line-height: 1.5; color: var(--muted-text); margin: 0; }
        .hub-link { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--btn-primary); text-decoration: none; }
        .hub-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="dashboard-stats">
            <div class="stat-box" onclick="changeExamDate()" title="Tap to change exam date">
                <div class="stat-title">Exam Countdown ✏️</div>
                <div class="stat-val" id="countdown">-- Days</div>
                <div class="stat-sub" id="exam-date-label">May 11, 2027</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Active Study Time</div>
                <div class="stat-val" id="study-time">0h 0m</div>
                <div class="stat-sub">Auto-tracked</div>
            </div>
        </div>

        <div class="top-bar">
            <button class="action-btn" onclick="toggleDarkMode()" id="dark-mode-btn">🌙 Dark</button>
            <button class="action-btn" onclick="toggleReadMode()" id="view-btn">📖 Read Mode</button>
            <button class="action-btn" onclick="shuffleDeck()" id="shuffle-btn" style="display:none; background:rgba(139,92,246,0.2); color:#a78bfa;">🔀 Shuffle</button>
            <button class="action-btn" onclick="resetProgress()" id="reset-btn" style="display:none; background:rgba(239,68,68,0.2); color:#f87171;">🔄 Reset</button>
        </div>

        <h2>CFA Level 1 Study Studio</h2>
        <select id="subject-select" onchange="loadSelectedDeck()">
            <option value="">-- Select a Deck or Mock Exam --</option>
            <optgroup label="Core Curriculum (2,000 Cards)">
                <option value="CFA_Ethics_Part1_Flashcards.xlsx">1. Ethics (Part 1)</option>
                <option value="CFA_Ethics_Part2_Flashcards.xlsx">1. Ethics (Part 2)</option>
                <option value="CFA_Quant_Part1_Flashcards.xlsx">2. Quantitative Methods (Part 1)</option>
                <option value="CFA_Quant_Part2_Flashcards.xlsx">2. Quantitative Methods (Part 2)</option>
                <option value="CFA_Economics_Part1_Flashcards.xlsx">3. Economics (Part 1)</option>
                <option value="CFA_Economics_Part2_Flashcards.xlsx">3. Economics (Part 2)</option>
                <option value="CFA_FSA_Part1_Flashcards.xlsx">4. Financial Statement Analysis (Part 1)</option>
                <option value="CFA_FSA_Part2_Flashcards.xlsx">4. Financial Statement Analysis (Part 2)</option>
                <option value="CFA_Corporate_Part1_Flashcards.xlsx">5. Corporate Issuers (Part 1)</option>
                <option value="CFA_Corporate_Part2_Flashcards.xlsx">5. Corporate Issuers (Part 2)</option>
                <option value="CFA_Equities_Part1_Flashcards.xlsx">6. Equity Investments (Part 1)</option>
                <option value="CFA_Equities_Part2_Flashcards.xlsx">6. Equity Investments (Part 2)</option>
                <option value="CFA_FixedIncome_Part1_Flashcards.xlsx">7. Fixed Income (Part 1)</option>
                <option value="CFA_FixedIncome_Part2_Flashcards.xlsx">7. Fixed Income (Part 2)</option>
                <option value="CFA_Derivatives_Part1_Flashcards.xlsx">8. Derivatives (Part 1)</option>
                <option value="CFA_Derivatives_Part2_Flashcards.xlsx">8. Derivatives (Part 2)</option>
                <option value="CFA_Alts_Part1_Flashcards.xlsx">9. Alternative Investments (Part 1)</option>
                <option value="CFA_Alts_Part2_Flashcards.xlsx">9. Alternative Investments (Part 2)</option>
                <option value="CFA_Portfolio_Part1_Flashcards.xlsx">10. Portfolio Management (Part 1)</option>
                <option value="CFA_Portfolio_Part2_Flashcards.xlsx">10. Portfolio Management (Part 2)</option>
            </optgroup>
            <optgroup label="Practice & Review (Mock Exams)">
                <option value="CFA_Mock_Exam_1.xlsx">🔥 Mock Exam 1</option>
                <option value="CFA_Mock_Exam_2.xlsx">🔥 Mock Exam 2</option>
                <option value="CFA_Mock_Exam_3.xlsx">🔥 Mock Exam 3</option>
                <option value="CFA_Mock_Exam_4.xlsx">🔥 Mock Exam 4</option>
                <option value="CFA_Mock_Exam_5.xlsx">🔥 Mock Exam 5</option>
                <option value="CFA_Mock_Exam_6.xlsx">🔥 Mock Exam 6</option>
                <option value="CFA_Mock_Exam_7.xlsx">🔥 Mock Exam 7</option>
                <option value="CFA_Mock_Exam_8.xlsx">🔥 Mock Exam 8</option>
                <option value="CFA_Mock_Exam_9.xlsx">🔥 Mock Exam 9</option>
                <option value="CFA_Mock_Exam_10.xlsx">🔥 Mock Exam 10</option>
            </optgroup>
        </select>
        
        <div class="progress-container" id="progress-container" style="display:none;">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="progress-text" id="progress">Pick a deck above, or explore the Hub below</div>
    </div>

    <div id="capture-area" style="width: 100%; max-width: 480px; display: flex; justify-content: center;">
        <div class="card-container" id="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-face card-front" id="card-front">Front</div>
                <div class="card-face card-back" id="card-back">Back</div>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="nav-btn" onclick="prevCard()" id="btn-prev">⬅️ Prev</button>
        <button class="nav-btn" onclick="nextCard()" id="btn-next">Next ➡️</button>
    </div>

    <div class="utilities" id="utilities">
        <button class="action-btn" onclick="toggleHint()" id="btn-hint" style="color: #d97706; background: rgba(217, 119, 6, 0.12); border-color: rgba(217, 119, 6, 0.3);">💡 Explain</button>
        <button class="action-btn" onclick="saveAsImage()" style="color: #059669; background: rgba(5, 150, 105, 0.12); border-color: rgba(5, 150, 105, 0.3);">📸 Save PNG</button>
    </div>
    <div class="hint-text" id="hint-text"></div>

    <div class="glass-panel" id="learning-hub">
        <h3 style="margin: 0 0 14px 0; text-align: center; font-weight: 800; font-size: 18px;">📚 CFA Learning Hub</h3>
        
        <div class="hub-tabs">
            <button class="hub-tab active" onclick="switchHubTab('formulas', this)">📐 Formula</button>
            <button class="hub-tab" onclick="switchHubTab('theory', this)">🧠 Theory</button>
            <button class="hub-tab" onclick="switchHubTab('youtube', this)">📺 YouTube</button>
            <button class="hub-tab" onclick="switchHubTab('forums', this)">💬 Forums</button>
            <button class="hub-tab" onclick="switchHubTab('platforms', this)">🏛️ Official</button>
            <button class="hub-tab" onclick="switchHubTab('news', this)">📰 News</button>
        </div>

        <input type="text" id="hub-search" class="search-input" placeholder="🔍 Search formulas, theory, or links..." onkeyup="filterHubContent()" style="margin-bottom: 14px;">

        <div id="hub-content"></div>
    </div>

    <script>
        let currentDeck = [], currentIndex = 0, currentFilename = "", isReadMode = false, activeHubTab = "formulas";

        let savedExamDate = localStorage.getItem('cfa_exam_date') || "2027-05-11";
        
        function updateCountdown() {
            const target = new Date(savedExamDate + "T09:00:00").getTime();
            const days = Math.ceil((target - new Date().getTime()) / (1000 * 60 * 60 * 24));
            document.getElementById("countdown").innerText = days > 0 ? `${days} Days` : "Exam Day!";
            document.getElementById("exam-date-label").innerText = new Date(savedExamDate + "T00:00:00").toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        function changeExamDate() {
            const input = prompt("Enter Exam Date (YYYY-MM-DD):", savedExamDate);
            if (input && /^\d{4}-\d{2}-\d{2}$/.test(input.trim())) {
                savedExamDate = input.trim(); localStorage.setItem('cfa_exam_date', savedExamDate); updateCountdown();
            }
        }
        updateCountdown();

        let studySeconds = parseInt(localStorage.getItem('cfa_study_time')) || 0, isStudying = false;
        function updateStudyTimeUI() { document.getElementById("study-time").innerText = `${Math.floor(studySeconds / 3600)}h ${Math.floor((studySeconds % 3600) / 60)}m`; }
        updateStudyTimeUI();
        setInterval(() => { if (isStudying) { studySeconds++; if (studySeconds % 10 === 0) localStorage.setItem('cfa_study_time', studySeconds); if (studySeconds % 60 === 0) updateStudyTimeUI(); } }, 1000);

        const formulaBank = [
            { tag: "Quant", title: "Sharpe Ratio", formula: "Sharpe = (Rp - Rf) / σp", desc: "Measures excess return per unit of total risk." },
            { tag: "Corp", title: "WACC", formula: "WACC = wd·rd·(1 - t) + wp·rp + we·re", desc: "After-tax cost of capital." },
            { tag: "PM", title: "CAPM", formula: "E(Ri) = Rf + βi · [E(Rm) - Rf]", desc: "Expected return based on systematic risk (Beta)." },
            { tag: "FSA", title: "DuPont ROE", formula: "ROE = Net Profit Margin × Asset Turnover × Leverage", desc: "Breaks ROE into profitability, efficiency, and leverage." },
            { tag: "FI", title: "Price Change", formula: "%ΔP ≈ -ModDur·ΔY + 0.5·Conv·(ΔY)²", desc: "Bond price sensitivity to yield changes." },
            { tag: "Deriv", title: "Put-Call Parity", formula: "C0 + X / (1 + Rf)^T = P0 + S0", desc: "Fiduciary Call equals Protective Put." }
        ];

        const theoryBank = [
            { tag: "Ethics", title: "Mosaic Theory", desc: "Analysts may combine material public info with non-material nonpublic insights without violating Standard II(A)." },
            { tag: "FSA", title: "IFRS vs. US GAAP", desc: "LIFO inventory is strictly prohibited under IFRS." },
            { tag: "FI", title: "Yield Curve Theories", desc: "Pure Expectations, Liquidity Preference, and Market Segmentation theories." },
            { tag: "Corp", title: "Pecking Order Theory", desc: "Firms prefer internal financing first, then debt, and issue equity only as a last resort." }
        ];

        const youtubeLinks = [
            { tag: "Top Instructor", title: "Mark Meldrum", desc: "Widely considered the gold standard for free CFA Level 1 concept videos on YouTube.", url: "https://www.youtube.com/c/MarkMeldrum" },
            { tag: "Prep Provider", title: "AnalystPrep", desc: "Excellent concise summaries and practice question walkthroughs.", url: "https://www.youtube.com/c/AnalystPrep" },
            { tag: "Deep Dives", title: "IFT", desc: "Very detailed, curriculum-aligned video lectures.", url: "https://www.youtube.com/user/IFTcfa" },
            { tag: "Crash Course", title: "Fintree", desc: "High-energy crash courses on complex topics.", url: "https://www.youtube.com/c/FinTreeIndia" }
        ];

        const forumLinks = [
            { tag: "Reddit", title: "r/CFA Subreddit", desc: "The largest active community of CFA candidates discussing study strategies and mock scores.", url: "https://www.reddit.com/r/CFA/" },
            { tag: "Forum", title: "AnalystForum", desc: "The classic discussion board for CFA candidates.", url: "https://www.analystforum.com/" },
            { tag: "Tools", title: "300Hours", desc: "Community-driven site with free guides and calculators.", url: "https://300hours.com/" }
        ];

        const officialPlatforms = [
            { tag: "Official", title: "CFA Candidate Resources", desc: "Official curriculum, practice questions, and PSM.", url: "https://www.cfainstitute.org/programs/cfa/candidate" },
            { tag: "Course", title: "MIT Finance Theory I", desc: "Free video lectures covering CAPM, fixed income, options.", url: "https://ocw.mit.edu/courses/15-401-finance-theory-i-fall-2008/" },
            { tag: "Practice", title: "SEC EDGAR Database", desc: "Look up real 10-K filings to practice FSA ratios.", url: "https://www.sec.gov/edgar/searchedgar/companysearch" }
        ];

        let liveNewsItems = [];
        async function fetchLiveNews() {
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://blogs.cfainstitute.org/investor/feed/')}`);
                const data = await res.json();
                if (data.status === 'ok') {
                    liveNewsItems = data.items.slice(0, 5).map(item => ({
                        tag: "Live Update • " + new Date(item.pubDate).toLocaleDateString(),
                        title: item.title,
                        desc: item.description.replace(/<[^>]*>?/gm, '').slice(0, 110) + "...",
                        url: item.link
                    }));
                    if (activeHubTab === 'news') renderHubContent();
                }
            } catch (e) {}
        }
        fetchLiveNews();

        function switchHubTab(tabName, btnEl) {
            activeHubTab = tabName;
            document.querySelectorAll('.hub-tab').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            document.getElementById('hub-search').value = "";
            renderHubContent();
        }

        function filterHubContent() { renderHubContent(document.getElementById('hub-search').value.toLowerCase()); }

        function renderHubContent(query = "") {
            const container = document.getElementById('hub-content');
            let items = [];
            if (activeHubTab === 'formulas') items = formulaBank;
            else if (activeHubTab === 'theory') items = theoryBank;
            else if (activeHubTab === 'youtube') items = youtubeLinks;
            else if (activeHubTab === 'forums') items = forumLinks;
            else if (activeHubTab === 'platforms') items = officialPlatforms;
            else if (activeHubTab === 'news') items = liveNewsItems;

            const filtered = items.filter(item => item.title.toLowerCase().includes(query) || item.tag.toLowerCase().includes(query) || (item.desc && item.desc.toLowerCase().includes(query)));
            if (filtered.length === 0) { container.innerHTML = `<p style="text-align:center; font-size:13px; color:var(--muted-text);">No matching items found.</p>`; return; }

            container.innerHTML = filtered.map(item => `
                <div class="hub-card">
                    <span class="hub-badge">${item.tag}</span>
                    <div class="hub-title">${item.title}</div>
                    ${item.formula ? `<div class="hub-formula">${item.formula}</div>` : ''}
                    <p class="hub-desc">${item.desc}</p>
                    ${item.url ? `<a class="hub-link" href="${item.url}" target="_blank" rel="noopener noreferrer">Open Link ↗</a>` : ''}
                </div>
            `).join('');
        }
        renderHubContent();

        if (localStorage.getItem('cfaDarkMode') === 'true') { document.body.classList.add('dark-mode'); document.getElementById('dark-mode-btn').innerText = '☀️ Light'; }
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('cfaDarkMode', document.body.classList.contains('dark-mode'));
            document.getElementById('dark-mode-btn').innerText = document.body.classList.contains('dark-mode') ? '☀️ Light' : '🌙 Dark';
        }

        function toggleReadMode() {
            isReadMode = !isReadMode;
            const viewBtn = document.getElementById('view-btn');
            if (isReadMode) { viewBtn.innerHTML = '🃏 Quiz Mode'; viewBtn.classList.add('active-toggle'); } 
            else { viewBtn.innerHTML = '📖 Read Mode'; viewBtn.classList.remove('active-toggle'); }
            if (currentDeck.length > 0) updateCard();
        }

        async function loadSelectedDeck() {
            currentFilename = document.getElementById('subject-select').value;
            if (!currentFilename) {
                isStudying = false;
                document.getElementById('card-container').style.display = 'none';
                document.getElementById('controls').style.display = 'none';
                document.getElementById('utilities').style.display = 'none';
                document.getElementById('shuffle-btn').style.display = 'none';
                document.getElementById('reset-btn').style.display = 'none';
                document.getElementById('progress-container').style.display = 'none';
                document.getElementById('progress').innerText = 'Pick a deck above, or explore the Hub below';
                return;
            }

            isStudying = true;
            document.getElementById('card-container').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('utilities').style.display = 'none';
            document.getElementById('progress').innerText = 'Loading deck...';

            try {
                const response = await fetch(currentFilename);
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const data = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                currentDeck = data.slice(1).filter(row => row.length >= 3).map(row => ({ front: row[1] || "", back: row[2] || "", hint: row[3] || "" }));
                if (currentDeck.length > 0) {
                    currentIndex = parseInt(localStorage.getItem(`cfa_progress_${currentFilename}`)) || 0;
                    if (currentIndex >= currentDeck.length) currentIndex = 0;
                    document.getElementById('card-container').style.display = 'block';
                    document.getElementById('controls').style.display = 'flex';
                    document.getElementById('utilities').style.display = 'flex';
                    document.getElementById('shuffle-btn').style.display = 'inline-block';
                    document.getElementById('reset-btn').style.display = 'inline-block';
                    document.getElementById('progress-container').style.display = 'block';
                    updateCard();
                }
            } catch (error) { document.getElementById('progress').innerText = 'Error: Ensure Excel file is uploaded to GitHub.'; isStudying = false; }
        }

        function updateCard() {
            document.getElementById('card').classList.remove('is-flipped');
            const data = currentDeck[currentIndex];
            const frontEl = document.getElementById('card-front');
            const backEl = document.getElementById('card-back');
            const hintBtn = document.getElementById('btn-hint');
            const hintTextEl = document.getElementById('hint-text');

            if (isReadMode) {
                let html = `<div style="font-weight:800; font-size:16px; color:var(--btn-primary); margin-bottom:12px; width:100%; border-bottom:1px solid rgba(100,116,139,0.2); padding-bottom:10px; white-space:pre-line;">${data.front}</div>`;
                html += `<div style="font-size:15px; margin-bottom:14px; width:100%; font-weight:500; white-space:pre-line;">${data.back}</div>`;
                if (data.hint) html += `<div style="font-size:13px; font-style:italic; color:#d97706; background:rgba(217,119,6,0.12); padding:10px; border-radius:10px; width:100%; box-sizing:border-box; font-weight:600;">💡 Explanation: ${data.hint}</div>`;
                frontEl.innerHTML = html; frontEl.style.justifyContent = 'flex-start'; backEl.innerHTML = "";
                hintBtn.style.display = 'none'; hintTextEl.style.display = 'none';
            } else {
                frontEl.innerText = data.front; frontEl.style.justifyContent = 'center'; backEl.innerText = data.back;
                hintTextEl.innerText = data.hint; hintTextEl.style.display = 'none'; hintBtn.style.display = data.hint ? 'inline-block' : 'none';
            }
            
            localStorage.setItem(`cfa_progress_${currentFilename}`, currentIndex);
            document.getElementById('progress-bar-fill').style.width = `${((currentIndex + 1) / currentDeck.length) * 100}%`;
            document.getElementById('progress').innerText = `Card ${currentIndex + 1} of ${currentDeck.length} (${isReadMode ? 'Read Mode' : 'Tap Card to Flip'})`;
            
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            if (currentIndex === currentDeck.length - 1) { document.getElementById('btn-next').disabled = true; confetti(); } else { document.getElementById('btn-next').disabled = false; }
        }

        function flipCard() { if (!isReadMode) document.getElementById('card').classList.toggle('is-flipped'); }
        function toggleHint() { const hint = document.getElementById('hint-text'); hint.style.display = hint.style.display === 'none' ? 'block' : 'none'; }
        function nextCard() { if (currentIndex < currentDeck.length - 1) { currentIndex++; updateCard(); } }
        function prevCard() { if (currentIndex > 0) { currentIndex--; updateCard(); } }
        function resetProgress() { if (confirm("Start this deck from Card 1?")) { currentIndex = 0; updateCard(); } }
        function shuffleDeck() { for (let i = currentDeck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]]; } currentIndex = 0; updateCard(); }

        function saveAsImage() {
            const cardEl = document.getElementById('card');
            const ogTransform = cardEl.style.transform;
            if (cardEl.classList.contains('is-flipped')) { cardEl.style.transform = "rotateY(0deg)"; document.getElementById('card-back').style.transform = "rotateY(0deg)"; document.getElementById('card-front').style.display = "none"; }
            html2canvas(cardEl, { backgroundColor: null, scale: 2 }).then(canvas => {
                const link = document.createElement('a'); link.download = `CFA_Flashcard_${currentIndex+1}.png`; link.href = canvas.toDataURL("image/png"); link.click();
                cardEl.style.transform = ogTransform; document.getElementById('card-back').style.transform = "rotateY(180deg)"; document.getElementById('card-front').style.display = "flex";
            });
        }

        let tsX = 0, teX = 0;
        const slider = document.getElementById('capture-area');
        slider.addEventListener('touchstart', e => tsX = e.changedTouches[0].screenX);
        slider.addEventListener('touchend', e => { teX = e.changedTouches[0].screenX; if (teX < tsX - 40) nextCard(); if (teX > tsX + 40) prevCard(); });
        document.addEventListener('keydown', e => { if (currentDeck.length === 0) return; if (e.key === 'ArrowRight') nextCard(); else if (e.key === 'ArrowLeft') prevCard(); else if (e.key === ' ' && !isReadMode) { e.preventDefault(); flipCard(); } });
        
        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    </script>
</body>
</html>
