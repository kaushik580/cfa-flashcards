<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CFA Master Flashcards & Study Hub</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">

    <!-- External Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root { 
            --bg-gradient: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            --text-color: #1e293b; 
            --muted-text: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 8px 32px rgba(30, 41, 59, 0.08);
            --card-bg: #ffffff; 
            --card-back-bg: linear-gradient(135deg, #1e3a8a, #0f172a); 
            --btn-primary: #2563eb; 
            --accent: #0ea5e9;
            --chip-bg: rgba(37, 99, 235, 0.1);
        }
        
        body.dark-mode { 
            --bg-gradient: linear-gradient(135deg, #0f172a, #020617);
            --text-color: #f8fafc; 
            --muted-text: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            --card-bg: #1e293b; 
            --card-back-bg: linear-gradient(135deg, #1e3a8a, #020617); 
            --btn-primary: #3b82f6; 
            --accent: #38bdf8;
            --chip-bg: rgba(59, 130, 246, 0.18);
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-gradient); 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 16px 14px 40px 14px; 
            margin: 0; 
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease; 
            overflow-x: hidden; 
        }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .dashboard-stats {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
            background: rgba(100, 116, 139, 0.07);
            border-radius: 16px;
            padding: 12px;
        }
        .stat-box { text-align: center; width: 48%; cursor: pointer; border-radius: 10px; padding: 4px; transition: background 0.2s; }
        .stat-box:hover { background: rgba(100, 116, 139, 0.1); }
        .stat-title { font-size: 11px; font-weight: 700; color: var(--muted-text); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-val { font-size: 19px; font-weight: 800; color: var(--btn-primary); }
        .stat-sub { font-size: 10px; color: var(--muted-text); margin-top: 2px; }

        .top-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .action-btn { padding: 9px 14px; font-size: 13px; background: rgba(100, 116, 139, 0.14); color: var(--text-color); border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer; font-weight: 700; transition: all 0.2s; }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.active-toggle { background: var(--btn-primary); color: white; border-color: var(--btn-primary); }
        
        h2 { margin: 0 0 14px 0; font-size: 23px; font-weight: 800; text-align: center; letter-spacing: -0.5px; }
        
        select, .search-input { 
            width: 100%; 
            padding: 14px 16px; 
            font-size: 15px; 
            border-radius: 14px; 
            border: 1px solid var(--glass-border); 
            background-color: var(--card-bg); 
            color: var(--text-color); 
            margin-bottom: 14px; 
            font-weight: 600; 
            outline: none; 
            box-sizing: border-box;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        
        .progress-container { width: 100%; background-color: rgba(100, 116, 139, 0.15); border-radius: 20px; height: 9px; margin-bottom: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--btn-primary)); width: 0%; transition: width 0.4s ease; border-radius: 20px; }
        .progress-text { font-size: 13px; font-weight: 700; text-align: center; color: var(--muted-text); }

        /* 3D Flashcard CSS */
        .card-container { perspective: 1500px; width: 100%; max-width: 480px; height: 360px; margin-bottom: 18px; cursor: pointer; display: none; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.12); }
        .card.is-flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px; box-sizing: border-box; border-radius: 24px; text-align: center; font-size: 18px; line-height: 1.55; font-weight: 600; overflow-y: auto; }
        .card-front { background: var(--card-bg); border: 1px solid var(--glass-border); }
        .card-back { transform: rotateY(180deg); background: var(--card-back-bg); color: white; border: 1px solid rgba(255,255,255,0.1); }
        
        .controls { display: none; width: 100%; max-width: 480px; justify-content: space-between; margin-bottom: 14px; }
        .nav-btn { padding: 15px 22px; font-size: 15px; border: none; border-radius: 14px; background: var(--btn-primary); color: white; cursor: pointer; font-weight: 800; width: 48%; box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25); transition: all 0.2s; }
        .nav-btn:active { transform: scale(0.96); }
        .nav-btn:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        
        .utilities { display: none; width: 100%; max-width: 480px; justify-content: center; gap: 10px; margin-bottom: 18px; }
        .hint-text { margin-bottom: 18px; font-style: italic; color: #d97706; display: none; font-size: 14px; padding: 14px; border-radius: 12px; background: rgba(217, 119, 6, 0.12); width: 100%; max-width: 480px; box-sizing: border-box; text-align: center; font-weight: 600; border: 1px solid rgba(217, 119, 6, 0.25); }

        /* Learning & Resource Hub */
        .hub-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }
        .hub-tab {
            padding: 10px 6px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--muted-text);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .hub-tab.active {
            background: var(--btn-primary);
            color: #ffffff;
            border-color: var(--btn-primary);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        }

        .hub-card {
            padding: 16px;
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--glass-border);
            text-align: left;
            box-shadow: 0 3px 8px rgba(0,0,0,0.03);
        }
        .hub-badge {
            display: inline-block;
            background: var(--chip-bg);
            color: var(--btn-primary);
            padding: 3px 9px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .hub-title {
            font-size: 15px;
            font-weight: 800;
            margin: 0 0 6px 0;
            color: var(--text-color);
        }
        .hub-formula {
            font-family: 'Courier New', monospace;
            background: rgba(100, 116, 139, 0.1);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            margin: 8px 0;
            color: var(--btn-primary);
            overflow-x: auto;
        }
        .hub-desc {
            font-size: 13px;
            line-height: 1.5;
            color: var(--muted-text);
            margin: 0;
        }
        .hub-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--btn-primary);
            text-decoration: none;
        }
        .hub-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="dashboard-stats">
            <div class="stat-box" onclick="changeExamDate()" title="Tap to change exam date">
                <div class="stat-title">Exam Countdown ✏️</div>
                <div class="stat-val" id="countdown">-- Days</div>
                <div class="stat-sub" id="exam-date-label">May 11, 2027</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Active Study Time</div>
                <div class="stat-val" id="study-time">0h 0m</div>
                <div class="stat-sub">Auto-tracked</div>
            </div>
        </div>

        <div class="top-bar">
            <button class="action-btn" onclick="toggleDarkMode()" id="dark-mode-btn">🌙 Dark</button>
            <button class="action-btn" onclick="toggleReadMode()" id="view-btn">📖 Read Mode</button>
            <button class="action-btn" onclick="shuffleDeck()" id="shuffle-btn" style="display:none;">🔀 Shuffle</button>
            <button class="action-btn" onclick="resetProgress()" id="reset-btn" style="display:none; color: #ef4444;">🔄 Reset</button>
        </div>

        <h2>CFA Level 1 Study Studio</h2>
        <select id="subject-select" onchange="loadSelectedDeck()">
            <option value="">-- Select a Subject Deck (2,000 Cards) --</option>
            <option value="CFA_Ethics_Part1_Flashcards.xlsx">1. Ethics (Part 1 - Cards 1–100)</option>
            <option value="CFA_Ethics_Part2_Flashcards.xlsx">1. Ethics (Part 2 - Cards 101–200)</option>
            <option value="CFA_Quant_Part1_Flashcards.xlsx">2. Quantitative Methods (Part 1)</option>
            <option value="CFA_Quant_Part2_Flashcards.xlsx">2. Quantitative Methods (Part 2)</option>
            <option value="CFA_Economics_Part1_Flashcards.xlsx">3. Economics (Part 1)</option>
            <option value="CFA_Economics_Part2_Flashcards.xlsx">3. Economics (Part 2)</option>
            <option value="CFA_FSA_Part1_Flashcards.xlsx">4. Financial Statement Analysis (Part 1)</option>
            <option value="CFA_FSA_Part2_Flashcards.xlsx">4. Financial Statement Analysis (Part 2)</option>
            <option value="CFA_Corporate_Part1_Flashcards.xlsx">5. Corporate Issuers (Part 1)</option>
            <option value="CFA_Corporate_Part2_Flashcards.xlsx">5. Corporate Issuers (Part 2)</option>
            <option value="CFA_Equities_Part1_Flashcards.xlsx">6. Equity Investments (Part 1)</option>
            <option value="CFA_Equities_Part2_Flashcards.xlsx">6. Equity Investments (Part 2)</option>
            <option value="CFA_FixedIncome_Part1_Flashcards.xlsx">7. Fixed Income (Part 1)</option>
            <option value="CFA_FixedIncome_Part2_Flashcards.xlsx">7. Fixed Income (Part 2)</option>
            <option value="CFA_Derivatives_Part1_Flashcards.xlsx">8. Derivatives (Part 1)</option>
            <option value="CFA_Derivatives_Part2_Flashcards.xlsx">8. Derivatives (Part 2)</option>
            <option value="CFA_Alts_Part1_Flashcards.xlsx">9. Alternative Investments (Part 1)</option>
            <option value="CFA_Alts_Part2_Flashcards.xlsx">9. Alternative Investments (Part 2)</option>
            <option value="CFA_Portfolio_Part1_Flashcards.xlsx">10. Portfolio Management (Part 1)</option>
            <option value="CFA_Portfolio_Part2_Flashcards.xlsx">10. Portfolio Management (Part 2)</option>
        </select>
        
        <div class="progress-container" id="progress-container" style="display:none;">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="progress-text" id="progress">Pick a deck above, or explore Formulas, Theory & Resources below</div>
    </div>

    <!-- Single-Card Swipe View (Supports Both Quiz Flip & Read Mode) -->
    <div id="capture-area" style="width: 100%; max-width: 480px; display: flex; justify-content: center;">
        <div class="card-container" id="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-face card-front" id="card-front">Front</div>
                <div class="card-face card-back" id="card-back">Back</div>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="nav-btn" onclick="prevCard()" id="btn-prev">⬅️ Prev</button>
        <button class="nav-btn" onclick="nextCard()" id="btn-next">Next ➡️</button>
    </div>

    <div class="utilities" id="utilities">
        <button class="action-btn" onclick="toggleHint()" id="btn-hint" style="color: #d97706; background: rgba(217, 119, 6, 0.12); border-color: rgba(217, 119, 6, 0.3);">💡 Show Hint</button>
        <button class="action-btn" onclick="saveAsImage()" style="color: #059669; background: rgba(5, 150, 105, 0.12); border-color: rgba(5, 150, 105, 0.3);">📸 Save Card PNG</button>
    </div>
    <div class="hint-text" id="hint-text"></div>

    <!-- CFA Learning Materials, Formulas, Open-Source Platforms & Live Updates -->
    <div class="glass-panel" id="learning-hub">
        <h3 style="margin: 0 0 14px 0; text-align: center; font-weight: 800; font-size: 18px;">📚 CFA Learning & Reference Hub</h3>
        
        <div class="hub-tabs">
            <button class="hub-tab active" onclick="switchHubTab('formulas', this)">📐 Formulas</button>
            <button class="hub-tab" onclick="switchHubTab('theory', this)">🧠 Theory</button>
            <button class="hub-tab" onclick="switchHubTab('platforms', this)">🏛️ Official</button>
            <button class="hub-tab" onclick="switchHubTab('news', this)">📰 Updates</button>
        </div>

        <input type="text" id="hub-search" class="search-input" placeholder="🔍 Search formulas, ratios, or theories..." onkeyup="filterHubContent()" style="margin-bottom: 14px;">

        <div id="hub-content"></div>
    </div>

    <script>
        let currentDeck = [];
        let currentIndex = 0;
        let currentFilename = "";
        let isReadMode = false;
        let activeHubTab = "formulas";

        // --- 1. Editable Exam Countdown Timer ---
        let savedExamDate = localStorage.getItem('cfa_exam_date') || "2027-05-11";
        
        function updateCountdown() {
            const target = new Date(savedExamDate + "T09:00:00").getTime();
            const now = new Date().getTime();
            const days = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
            document.getElementById("countdown").innerText = days > 0 ? `${days} Days` : "Exam Day!";
            const dateObj = new Date(savedExamDate + "T00:00:00");
            document.getElementById("exam-date-label").innerText = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function changeExamDate() {
            const input = prompt("Enter her CFA Exam Date (YYYY-MM-DD):", savedExamDate);
            if (input && /^\d{4}-\d{2}-\d{2}$/.test(input.trim())) {
                savedExamDate = input.trim();
                localStorage.setItem('cfa_exam_date', savedExamDate);
                updateCountdown();
            }
        }
        updateCountdown();

        // --- 2. Study Time Tracker ---
        let studySeconds = parseInt(localStorage.getItem('cfa_study_time')) || 0;
        let isStudying = false;

        function updateStudyTimeUI() {
            const hours = Math.floor(studySeconds / 3600);
            const minutes = Math.floor((studySeconds % 3600) / 60);
            document.getElementById("study-time").innerText = `${hours}h ${minutes}m`;
        }
        updateStudyTimeUI();

        setInterval(() => {
            if (isStudying) {
                studySeconds++;
                if (studySeconds % 10 === 0) localStorage.setItem('cfa_study_time', studySeconds);
                if (studySeconds % 60 === 0) updateStudyTimeUI();
            }
        }, 1000);

        // --- 3. Learning Hub Data (Formulas, Theory & Methodologies, Authenticated Platforms) ---
        const formulaBank = [
            { tag: "Quantitative Methods", title: "Sharpe Ratio & Coefficient of Variation", formula: "Sharpe = (Rp - Rf) / σp   |   CV = s / X̄", desc: "Sharpe measures excess return per unit of total risk. CV measures risk per unit of mean return (lower CV is better)." },
            { tag: "Corporate Issuers", title: "Weighted Average Cost of Capital (WACC)", formula: "WACC = wd·rd·(1 - t) + wp·rp + we·re", desc: "Blended after-tax cost of capital. Interest on debt is tax-deductible, creating a tax shield (1 - t)." },
            { tag: "Portfolio Management", title: "Capital Asset Pricing Model (CAPM)", formula: "E(Ri) = Rf + βi · [E(Rm) - Rf]", desc: "Prices expected return based solely on systematic risk (Beta). Unsystematic risk is diversified away." },
            { tag: "Financial Statement Analysis", title: "3-Part & 5-Part DuPont ROE", formula: "ROE = Net Profit Margin × Asset Turnover × Equity Multiplier", desc: "Decomposes ROE into profitability (NI/Sales), efficiency (Sales/Assets), and financial leverage (Assets/Equity)." },
            { tag: "Financial Statement Analysis", title: "Free Cash Flow (FCFF & FCFE)", formula: "FCFF = CFO + Int(1 - t) - FCInv   |   FCFE = CFO - FCInv + Net Borrowing", desc: "FCFF is cash available to all capital providers; FCFE is cash available exclusively to common shareholders." },
            { tag: "Equity Investments", title: "Gordon Growth Model (DDM)", formula: "V0 = D1 / (r - g), where D1 = D0 · (1 + g)", desc: "Values mature dividend-paying stocks assuming constant perpetual dividend growth (requires r > g)." },
            { tag: "Fixed Income", title: "Modified Duration & Price Change", formula: "ModDur = MacDur / (1 + YTM)   |   %ΔPrice ≈ -ModDur·ΔY + 0.5·Conv·(ΔY)²", desc: "Estimates percentage bond price sensitivity to yield changes, adjusted upward for positive convexity." },
            { tag: "Derivatives", title: "Put-Call Parity (European Options)", formula: "C0 + X / (1 + Rf)^T = P0 + S0", desc: "Fiduciary Call equals Protective Put. Used to price synthetic instruments and spot arbitrage." },
            { tag: "Alternative Investments", title: "Private Equity Multiples", formula: "TVPI = DPI + RVPI", desc: "Total Value to Paid-In equals Distributed (realized cash) plus Residual Value (unrealized NAV) divided by paid-in capital." }
        ];

        const theoryBank = [
            { tag: "Ethics Methodology", title: "The Mosaic Theory Framework", desc: "Analysts may combine material public information with non-material nonpublic insights (e.g., supplier checks, industry interviews) to form investment conclusions without violating Standard II(A)." },
            { tag: "FSA Methodology", title: "IFRS vs. US GAAP Core Differences", desc: "LIFO inventory is prohibited under IFRS (allowed under US GAAP). Development costs can be capitalized under IFRS once feasibility is proven, whereas US GAAP expenses them as incurred." },
            { tag: "Fixed Income Theory", title: "Yield Curve Term Structure Theories", desc: "Pure Expectations (forward rates equal expected future spot rates), Liquidity Preference (investors demand a maturity premium for longer duration), and Market Segmentation (supply/demand within isolated maturity buckets)." },
            { tag: "Corporate Finance Theory", title: "Pecking Order vs. Static Trade-Off Theory", desc: "Pecking Order: Firms prefer internal financing first, then debt, and issue equity only as a last resort due to signaling. Static Trade-Off: Optimal debt balances tax shields against financial distress costs." },
            { tag: "Behavioral Finance", title: "Cognitive Errors vs. Emotional Biases", desc: "Cognitive errors (Anchoring, Confirmation, Conservatism, Mental Accounting) stem from faulty reasoning and can be corrected with better data. Emotional biases (Loss Aversion, Overconfidence, Endowment) stem from feelings and must often be accommodated." },
            { tag: "Economics Methodology", title: "Monetary & Fiscal Policy Mix", desc: "Central banks adjust policy rates, reserve requirements, and open market operations toward the Neutral Rate (Real Trend Growth + Inflation Target). Fiscal policy uses government spending and taxation via the Fiscal Multiplier." }
        ];

        const officialPlatforms = [
            { tag: "Official CFA Institute", title: "CFA Institute Candidate Resources & Learning Ecosystem", desc: "Official curriculum readings, practice questions, mock exams, and Practical Skills Modules (PSM) directly from CFA Institute.", url: "https://www.cfainstitute.org/programs/cfa/candidate" },
            { tag: "Official Ethics", title: "CFA Code of Ethics & Standards of Practice Handbook", desc: "Free official handbook containing all 7 Standards (including Standard I(E) Competence) and real-world ethical case studies.", url: "https://www.cfainstitute.org/ethics/codes/ethics-code-standards" },
            { tag: "Open-Source University", title: "MIT OpenCourseWare – Finance Theory I", desc: "Free university-level video lectures and problem sets covering valuation, capital budgeting, CAPM, fixed income, and options.", url: "https://ocw.mit.edu/courses/15-401-finance-theory-i-fall-2008/" },
            { tag: "Open-Source Learning", title: "Khan Academy – Finance & Capital Markets", desc: "Free interactive lessons on interest rates, inflation, stocks, bonds, options, and accounting fundamentals.", url: "https://www.khanacademy.org/economics-finance-domain/core-finance" },
            { tag: "Real Filings Practice", title: "SEC EDGAR Company Filings Database", desc: "Look up real 10-K and 10-Q financial statements to practice FSA ratios, cash flow classification, and footnote analysis.", url: "https://www.sec.gov/edgar/searchedgar/companysearch" }
        ];

        let liveNewsItems = [
            { tag: "CFA Curriculum", title: "CFA Program Practical Skills Modules (PSM) & Competency Requirements", desc: "Review Python, Financial Modeling, and Analyst Skills modules required alongside Level I exam completion.", url: "https://www.cfainstitute.org/programs/cfa/curriculum" },
            { tag: "Macro & Rates", title: "Global Central Bank Policy & Sovereign Yield Curve Shifts", desc: "Track live fixed income and macroeconomic developments on CNBC Markets.", url: "https://www.cnbc.com/markets/" },
            { tag: "FSA & Markets", title: "Corporate Earnings & IFRS/GAAP Financial Reporting Trends", desc: "Follow live corporate financial analysis and market updates.", url: "https://www.reuters.com/markets/" }
        ];

        async function fetchLiveNews() {
            try {
                const rssUrl = encodeURIComponent('https://search.cnbc.com/rs/search/combinedcms/view.xml?id=10000664');
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
                const data = await res.json();
                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    liveNewsItems = data.items.slice(0, 5).map(item => ({
                        tag: "Live Market News • " + new Date(item.pubDate).toLocaleDateString(),
                        title: item.title,
                        desc: (item.description || "").replace(/<[^>]*>?/gm, '').slice(0, 130) + "...",
                        url: item.link
                    }));
                    if (activeHubTab === 'news') renderHubContent();
                }
            } catch (e) {
                // Keeps clean curated fallback items if offline or blocked
            }
        }
        fetchLiveNews();

        function switchHubTab(tabName, btnEl) {
            activeHubTab = tabName;
            document.querySelectorAll('.hub-tab').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            document.getElementById('hub-search').value = "";
            renderHubContent();
        }

        function filterHubContent() {
            renderHubContent(document.getElementById('hub-search').value.toLowerCase());
        }

        function renderHubContent(query = "") {
            const container = document.getElementById('hub-content');
            let items = [];
            if (activeHubTab === 'formulas') items = formulaBank;
            else if (activeHubTab === 'theory') items = theoryBank;
            else if (activeHubTab === 'platforms') items = officialPlatforms;
            else if (activeHubTab === 'news') items = liveNewsItems;

            const filtered = items.filter(item =>
                item.title.toLowerCase().includes(query) ||
                item.tag.toLowerCase().includes(query) ||
                (item.desc && item.desc.toLowerCase().includes(query)) ||
                (item.formula && item.formula.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; font-size:13px; color:var(--muted-text);">No matching items found.</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="hub-card">
                    <span class="hub-badge">${item.tag}</span>
                    <div class="hub-title">${item.title}</div>
                    ${item.formula ? `<div class="hub-formula">${item.formula}</div>` : ''}
                    <p class="hub-desc">${item.desc}</p>
                    ${item.url ? `<a class="hub-link" href="${item.url}" target="_blank" rel="noopener noreferrer">Open Resource ↗</a>` : ''}
                </div>
            `).join('');
        }
        renderHubContent();

        // --- 4. Dark Mode ---
        if (localStorage.getItem('cfaDarkMode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('dark-mode-btn').innerText = '☀️ Light';
        }
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('cfaDarkMode', isDark);
            document.getElementById('dark-mode-btn').innerText = isDark ? '☀️ Light' : '🌙 Dark';
        }

        // --- 5. Single-Card Swipe Read Mode vs. Quiz Flip Mode ---
        function toggleReadMode() {
            isReadMode = !isReadMode;
            const viewBtn = document.getElementById('view-btn');
            if (isReadMode) {
                viewBtn.innerHTML = '🃏 Quiz Mode';
                viewBtn.classList.add('active-toggle');
            } else {
                viewBtn.innerHTML = '📖 Read Mode';
                viewBtn.classList.remove('active-toggle');
            }
            if (currentDeck.length > 0) updateCard();
        }

        async function loadSelectedDeck() {
            currentFilename = document.getElementById('subject-select').value;
            if (!currentFilename) {
                isStudying = false;
                document.getElementById('card-container').style.display = 'none';
                document.getElementById('controls').style.display = 'none';
                document.getElementById('utilities').style.display = 'none';
                document.getElementById('hint-text').style.display = 'none';
                document.getElementById('shuffle-btn').style.display = 'none';
                document.getElementById('reset-btn').style.display = 'none';
                document.getElementById('progress-container').style.display = 'none';
                document.getElementById('progress').innerText = 'Pick a deck above, or explore Formulas, Theory & Resources below';
                return;
            }

            isStudying = true;
            document.getElementById('card-container').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('utilities').style.display = 'none';
            document.getElementById('hint-text').style.display = 'none';
            document.getElementById('progress').innerText = 'Loading verified deck...';

            try {
                const response = await fetch(currentFilename);
                if (!response.ok) throw new Error("File not found");
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                currentDeck = data.slice(1).filter(row => row.length >= 3).map(row => ({
                    front: row[1] || "",
                    back: row[2] || "",
                    hint: row[3] || ""
                }));

                if (currentDeck.length > 0) {
                    let savedIndex = localStorage.getItem(`cfa_progress_${currentFilename}`);
                    currentIndex = savedIndex ? parseInt(savedIndex) : 0;
                    if (currentIndex >= currentDeck.length) currentIndex = 0;

                    document.getElementById('card-container').style.display = 'block';
                    document.getElementById('controls').style.display = 'flex';
                    document.getElementById('utilities').style.display = 'flex';
                    document.getElementById('shuffle-btn').style.display = 'inline-block';
                    document.getElementById('reset-btn').style.display = 'inline-block';
                    document.getElementById('progress-container').style.display = 'block';
                    updateCard();
                }
            } catch (error) {
                document.getElementById('progress').innerText = 'Error: Ensure the 20 verified .xlsx files are uploaded to GitHub.';
                isStudying = false;
            }
        }

        function updateCard() {
            document.getElementById('card').classList.remove('is-flipped');
            const cardData = currentDeck[currentIndex];
            const frontEl = document.getElementById('card-front');
            const backEl = document.getElementById('card-back');
            const hintBtn = document.getElementById('btn-hint');
            const hintTextEl = document.getElementById('hint-text');

            if (isReadMode) {
                // Single-card Read Mode: Topic + Answer + Hint all visible on one swipeable card
                let html = `<div style="font-weight:800; font-size:18px; color:var(--btn-primary); margin-bottom:12px; width:100%; border-bottom:1px solid rgba(100,116,139,0.2); padding-bottom:10px;">${cardData.front}</div>`;
                html += `<div style="font-size:16px; margin-bottom:14px; width:100%; font-weight:500; white-space:pre-line;">${cardData.back}</div>`;
                if (cardData.hint) {
                    html += `<div style="font-size:13px; font-style:italic; color:#d97706; background:rgba(217,119,6,0.12); padding:10px; border-radius:10px; width:100%; box-sizing:border-box; font-weight:600;">💡 ${cardData.hint}</div>`;
                }
                frontEl.innerHTML = html;
                frontEl.style.justifyContent = 'flex-start';
                backEl.innerHTML = "";
                hintBtn.style.display = 'none';
                hintTextEl.style.display = 'none';
            } else {
                // Quiz Mode: Tap to flip
                frontEl.innerText = cardData.front;
                frontEl.style.justifyContent = 'center';
                backEl.innerText = cardData.back;
                hintTextEl.innerText = cardData.hint;
                hintTextEl.style.display = 'none';
                hintBtn.style.display = cardData.hint ? 'inline-block' : 'none';
            }
            
            localStorage.setItem(`cfa_progress_${currentFilename}`, currentIndex);
            
            const percent = ((currentIndex + 1) / currentDeck.length) * 100;
            document.getElementById('progress-bar-fill').style.width = percent + '%';
            document.getElementById('progress').innerText = `Card ${currentIndex + 1} of ${currentDeck.length} (${isReadMode ? 'Read Mode' : 'Tap Card to Flip'})`;
            
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            if (currentIndex === currentDeck.length - 1) {
                document.getElementById('btn-next').disabled = true;
                triggerConfetti();
            } else {
                document.getElementById('btn-next').disabled = false;
            }
        }

        function flipCard() { if (!isReadMode) document.getElementById('card').classList.toggle('is-flipped'); }
        function toggleHint() { 
            const hint = document.getElementById('hint-text');
            hint.style.display = hint.style.display === 'none' ? 'block' : 'none';
        }
        function nextCard() { if (currentIndex < currentDeck.length - 1) { currentIndex++; updateCard(); } }
        function prevCard() { if (currentIndex > 0) { currentIndex--; updateCard(); } }
        
        function resetProgress() {
            if (confirm("Start this deck from Card 1?")) {
                currentIndex = 0;
                updateCard();
            }
        }

        function shuffleDeck() {
            for (let i = currentDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function triggerConfetti() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }

        function saveAsImage() {
            const cardEl = document.getElementById('card');
            const originalTransform = cardEl.style.transform;
            if (cardEl.classList.contains('is-flipped')) {
                cardEl.style.transform = "rotateY(0deg)";
                document.getElementById('card-back').style.transform = "rotateY(0deg)";
                document.getElementById('card-front').style.display = "none";
            }
            html2canvas(cardEl, { backgroundColor: null, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `CFA_Flashcard_${currentIndex+1}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                cardEl.style.transform = originalTransform;
                document.getElementById('card-back').style.transform = "rotateY(180deg)";
                document.getElementById('card-front').style.display = "flex";
            });
        }

        // Keyboard & Touch Swipe Support (Works in BOTH Quiz Mode and Read Mode)
        document.addEventListener('keydown', (e) => {
            if (currentDeck.length === 0) return;
            if (e.key === 'ArrowRight') nextCard();
            else if (e.key === 'ArrowLeft') prevCard();
            else if (e.key === ' ' && !isReadMode) { e.preventDefault(); flipCard(); }
        });

        let touchstartX = 0, touchendX = 0;
        const slider = document.getElementById('capture-area');
        slider.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; });
        slider.addEventListener('touchend', e => { 
            touchendX = e.changedTouches[0].screenX; 
            if (touchendX < touchstartX - 40) nextCard(); 
            if (touchendX > touchstartX + 40) prevCard(); 
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed:', err));
            });
        }
    </script>
</body>
</html>
